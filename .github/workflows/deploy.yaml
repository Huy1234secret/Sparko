name: Deploy
# Manual production release. Each run is a deliberate decision: it only
# deploys a commit on main whose Checks passed, uploads that exact source to
# the server and runs infra/deploy-release.sh there. Add required reviewers
# to the "production" environment in GitHub settings for a second approval.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy (must be on main and have passed Checks)
        required: true
        default: main
      check_public_site:
        description: Check https://panel.coin-sprite.com afterwards (turn off until DNS points at the server)
        type: boolean
        default: true
permissions:
  contents: read
  checks: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://panel.coin-sprite.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require a commit on main that passed Checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Merge it through a pull request first."
            exit 1
          fi
          conclusion=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=verify" \
            --jq '[.check_runs[].conclusion] | first // "missing"')
          if [ "$conclusion" != success ]; then
            echo "::error::Checks have not passed for $sha (verify: $conclusion)."
            exit 1
          fi
          echo "SHA=$sha" >>"$GITHUB_ENV"
          echo "Deploying $sha"
      - name: Prepare the SSH connection
        env:
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          RAW_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Pasted secrets often carry spaces or a trailing line break.
          host=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')
          for pair in "DEPLOY_HOST=$host" "DEPLOY_USER=$user" \
            "DEPLOY_SSH_KEY=${DEPLOY_SSH_KEY:+set}" "DEPLOY_KNOWN_HOSTS=${DEPLOY_KNOWN_HOSTS:+set}"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::Repository secret ${pair%%=*} is not set. See docs/deploy-vultr.md."
              exit 1
            fi
          done
          if ! [[ $user =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER must be just the user name, deploy."
            exit 1
          fi
          echo "DEPLOY_HOST=$host" >>"$GITHUB_ENV"
          echo "DEPLOY_USER=$user" >>"$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          # Keys pasted from Windows can carry CR line endings; OpenSSH rejects them.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' >~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key: the connection fails rather than trusting a new server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' >~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. Paste the whole sparko-deploy file (not the .pub), from BEGIN to END."
            exit 1
          fi
      - name: Check the SSH connection
        run: |
          if ! out=$(ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" true 2>&1); then
            echo "$out"
            case "$out" in
              *"Host key verification failed"*|*"No ED25519 host key"*|*"REMOTE HOST IDENTIFICATION"*)
                echo "::error::DEPLOY_KNOWN_HOSTS does not match the server. Use the line server-setup.sh printed: 64.177.44.183 ssh-ed25519 AAAA..." ;;
              *"Permission denied"*)
                echo "::error::The server refused the key. Check DEPLOY_USER is deploy and that sparko-deploy.pub is in /home/deploy/.ssh/authorized_keys." ;;
              *"timed out"*|*"Connection refused"*|*"No route"*)
                echo "::error::Cannot reach $DEPLOY_HOST on port 22. Check DEPLOY_HOST and any Vultr firewall group." ;;
              *) echo "::error::SSH failed; see the output above." ;;
            esac
            exit 1
          fi
      - name: Upload and release
        run: |
          git archive --format=tar.gz -o release.tar.gz "$SHA"
          scp -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/sparko/incoming/$SHA.tar.gz"
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "tar -xzOf /opt/sparko/incoming/$SHA.tar.gz infra/deploy-release.sh | bash -s $SHA"
      - name: Check the public site
        if: ${{ inputs.check_public_site }}
        run: |
          for path in /health/live /health/ready /api/v1/public/status /privacy; do
            curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null \
              -w "$path %{http_code}\n" "https://panel.coin-sprite.com$path"
          done
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
