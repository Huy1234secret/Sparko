services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: sparko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local PostgreSQL password}
      POSTGRES_DB: sparko
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparko -d sparko"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.6-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
  redis:
