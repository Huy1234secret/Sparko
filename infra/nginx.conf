server {
  listen 8080;
  server_name panel.coin-sprite.com;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  include /etc/nginx/security-headers.conf;
  # The outer TLS proxy must overwrite X-Forwarded-Proto. This web listener is
  # bound to loopback in Compose; PUBLIC_APP_URL must be the HTTPS origin.
  location ~ ^/api/v1(?:/|$) {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_no_cache 1;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location /health/ { proxy_pass http://api:3001; access_log off; }
  location = /ws/events {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 60s;
  }
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public,max-age=31536000,immutable";
  }
  location ~* \.(png|gif|svg|json|woff2?|ico|map|js|css|conf)$ { try_files $uri =404; }
  location ~ ^/(dashboard|account|owner|servers)(/|$) {
    include /etc/nginx/security-headers.conf;
    add_header X-Robots-Tag "noindex,nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files /app.html =404;
  }
  location = /app.html {
    internal;
    include /etc/nginx/security-headers.conf;
    add_header X-Robots-Tag "noindex,nofollow" always;
    add_header Cache-Control "no-store" always;
  }
  location / { try_files $uri/index.html $uri /app.html; }
}
