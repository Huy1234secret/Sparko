server {
  listen 8080;
  server_name panel.coin-sprite.com;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.discordapp.com https://media.discordapp.net data: blob:; font-src 'self'; connect-src 'self' wss://panel.coin-sprite.com; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://discord.com" always;
  location /api/v1/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location /health/ { proxy_pass http://api:3001; }
  location /ws/events {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 60s;
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public,max-age=31536000,immutable";
  }
  location ~* \.(png|gif|svg|json|woff2?|ico)$ { try_files $uri =404; }
  location ~ ^/(dashboard|account|owner|servers)(/|$) {
    add_header X-Robots-Tag "noindex,nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
  location / { try_files $uri $uri/ /index.html; }
}
