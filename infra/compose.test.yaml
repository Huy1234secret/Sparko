name: sparko-disposable-tests
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      {
        POSTGRES_USER: sparko,
        POSTGRES_PASSWORD: sparko,
        POSTGRES_DB: sparko_test,
      }
    ports: ['127.0.0.1:55432:5432']
    tmpfs: ['/var/lib/postgresql/data']
    volumes:
      ['./test-databases.sql:/docker-entrypoint-initdb.d/test-databases.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sparko -d sparko_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.6-bookworm
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
