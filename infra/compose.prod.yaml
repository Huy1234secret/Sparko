name: sparko
# Bounded, rotating container logs (about 50 MB per service), matching the
# privacy policy's promise that request logs are overwritten automatically.
x-logging: &default-logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }
x-runtime-environment: &runtime-environment
  NODE_ENV: production
  APP_VERSION: ${APP_VERSION:-0.1.0}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Required HTTPS origin}
  DATABASE_URL: ${DATABASE_URL:?Required PostgreSQL URL with postgres service hostname}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  SESSION_SECRET: ${SESSION_SECRET:?Required independent random session secret}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Required 64 hexadecimal characters}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:?Required exact production callback}
  OWNER_USER_IDS: ${OWNER_USER_IDS:-}
  TRUST_PROXY: 'true'
  STORAGE_PATH: /app/.data/private
  LOG_LEVEL: ${LOG_LEVEL:-info}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
  STRIPE_API_VERSION: ${STRIPE_API_VERSION:-}
  PAYPAL_ENV: ${PAYPAL_ENV:-live}
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_PLAN_ID: ${PAYPAL_PLAN_ID:-}
  PAYPAL_PLAN_ID_SEMIANNUAL: ${PAYPAL_PLAN_ID_SEMIANNUAL:-}
  PAYPAL_PLAN_ID_ANNUAL: ${PAYPAL_PLAN_ID_ANNUAL:-}
  PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  SOCIAL_ALLOWED_HOSTS: ${SOCIAL_ALLOWED_HOSTS:-}
services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: sparko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: sparko
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sparko -d sparko']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  redis:
    image: redis:7.4.6-bookworm
    restart: unless-stopped
    logging: *default-logging
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
  migrate:
    image: sparko-migrate:${APP_VERSION:-local}
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    environment: *runtime-environment
    command:
      [
        'node',
        'packages/db/node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--config',
        'packages/db/prisma.config.ts',
      ]
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'
    logging: *default-logging
    mem_limit: 512m
  api:
    image: sparko-api:${APP_VERSION:-local}
    build:
      {
        context: ..,
        dockerfile: infra/Dockerfile,
        target: runtime,
        args: { SERVICE: api },
      }
    restart: unless-stopped
    logging: *default-logging
    environment: { <<: *runtime-environment, PORT: 3001 }
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    volumes: ['private:/app/.data/private']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 512m
    stop_grace_period: 30s
  bot:
    image: sparko-bot:${APP_VERSION:-local}
    profiles: ['discord']
    build:
      {
        context: ..,
        dockerfile: infra/Dockerfile,
        target: runtime,
        args: { SERVICE: bot },
      }
    restart: unless-stopped
    logging: *default-logging
    environment:
      {
        <<: *runtime-environment,
        DISCORD_GATEWAY_INTENTS: '${DISCORD_GATEWAY_INTENTS:-guilds,messages,reactions,voice}',
      }
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    healthcheck:
      test: ['CMD', 'node', '--import', 'tsx', 'tools/health.ts', 'bot']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 512m
    stop_grace_period: 30s
  worker:
    image: sparko-worker:${APP_VERSION:-local}
    profiles: ['discord']
    build:
      {
        context: ..,
        dockerfile: infra/Dockerfile,
        target: runtime,
        args: { SERVICE: worker },
      }
    restart: unless-stopped
    logging: *default-logging
    environment: *runtime-environment
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    volumes: ['private:/app/.data/private']
    healthcheck:
      test: ['CMD', 'node', '--import', 'tsx', 'tools/health.ts', 'worker']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 768m
    stop_grace_period: 30s
  web:
    image: sparko-web:${APP_VERSION:-local}
    build: { context: .., dockerfile: infra/Dockerfile, target: web }
    restart: unless-stopped
    logging: *default-logging
    ports: ['127.0.0.1:8080:8080']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:8080/health/ready',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 128m
volumes:
  postgres:
  redis:
  private:
