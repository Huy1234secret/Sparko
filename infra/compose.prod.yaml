name: sparko
services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: sparko
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparko -d sparko"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  redis:
    image: redis:7.4.6-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
  api:
    build: {context: .., dockerfile: infra/Dockerfile, target: runtime, args: {SERVICE: api}}
    restart: unless-stopped
    env_file: ../.env
    environment: {PORT: 3001, NODE_ENV: production, TRUST_PROXY: "true"}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: ["private:/app/.data/private"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    stop_grace_period: 30s
  bot:
    build: {context: .., dockerfile: infra/Dockerfile, target: runtime, args: {SERVICE: bot}}
    restart: unless-stopped
    env_file: ../.env
    environment: {NODE_ENV: production}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    mem_limit: 512m
    stop_grace_period: 30s
  worker:
    build: {context: .., dockerfile: infra/Dockerfile, target: runtime, args: {SERVICE: worker}}
    restart: unless-stopped
    env_file: ../.env
    environment: {NODE_ENV: production}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: ["private:/app/.data/private"]
    mem_limit: 768m
    stop_grace_period: 30s
  web:
    build: {context: .., dockerfile: infra/Dockerfile, target: web}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 128m
volumes:
  postgres:
  redis:
  private:
