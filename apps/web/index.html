<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" />
    <meta
      name="description"
      content="Sparko brings thoughtful community tools, beautiful Discord messages, and clear server management together."
    />
    <link rel="icon" type="image/svg+xml" href="/sparko.svg" />
    <title>Sparko — A little spark for your community</title>
    <script>
      try {
        const p =
          JSON.parse(localStorage.getItem('sparko-ui') || '{}').state?.theme ||
          'dark';
        document.documentElement.dataset.theme =
          p === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : p;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
